plugins { id 'com.android.application' }
android {
    namespace 'ke.co.vcyber.admin'
    compileSdk 34
    defaultConfig {
        applicationId 'ke.co.vcyber.admin'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { manifestPlaceholders = [cleartext: 'true']; applicationIdSuffix '.debug' }
        release { manifestPlaceholders = [cleartext: 'false']; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

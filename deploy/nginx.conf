# Use after provisioning a TLS certificate for vcyber.co.ke.
# The Node port must remain private: compose binds it to 127.0.0.1.
server {
    listen 80;
    server_name vcyber.co.ke www.vcyber.co.ke;
    return 301 https://vcyber.co.ke$request_uri;
}
server {
    listen 443 ssl;
    server_name vcyber.co.ke;
    ssl_certificate /etc/letsencrypt/live/vcyber.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vcyber.co.ke/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 105m;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 240s;
        # Do not log callback query secrets, receipts or document data.
        access_log off;
    }
}
